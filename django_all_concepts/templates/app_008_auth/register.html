{%extends 'base.html'%}
{% load static %}
<html lang="en">
  <head>
    {%block style%}
    <link rel="stylesheet" href="{%static 'css/register_form.css'%}">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    {%endblock style%}
  </head>
  <body>
    {%block body%}
    <div>
        <div class="d-flex justify-content-center">
            <div class="d-block w-25">
                <h4>Sign Up User</h4>
                <hr class="hr">
            </div>
        </div>
        <div class="d-flex justify-content-center mt-3">
            <div class="form">
                <form method="post">
                    {{form.as_p}}
                    {%csrf_token%}
                    <div class="d-flex" style="gap:10px">
                        <a href="{url 'home'}" class="btn btn-outline-info">Cancel</a>
                        <button type="submit" class="btn btn-outline-success">Sign Up</button>
                </form>
            </div>
        </div>
    </div>
    <script src="{%static 'register_form.js'%}"></script>
    {%endblock body%}
  </body>
</html>
