<!DOCTYPE html>
{% extends "base.html" %}
{%load static%}
<html>
    <body>
        {% block body%}
            {%if data%}
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Name</th>
                            <th scope="col">Address</th>
                            <th scope="col">Phone</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for value in data %}
                        <tr>
                            <th scope="row">1</th>
                            <th scope="row">{{value.name}}</th>
                            <th scope="row">{{value.address}}</th>
                            <th scope="row">{{value.phone}}</th>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {%else%}
            <p>data is not available
            {%endif%}
        {% endblock body%}
    </body>
</html>
