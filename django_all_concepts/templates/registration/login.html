{%extends 'base.html'%}
{%load static%}
<html lang="en">
  <head>
    {%block style%}
    {%endblock style%}
  </head>
  <body>
    {%block body%}
    <div>
        <div class="d-flex mt-5 justify-content-center">
            <div class="d-block w-25">
                <h4>Login User</h4>
                <hr style="color green; border: 1px solid green;">
            </div>
        </div>
        <div class="d-flex justify-content-center mt-3">
            <form method="post">
                {{form.as_p}}
                {%csrf_token%}
                <div class="d-flex" style="gap:10px">
                    <a href="{url 'home'}" class="btn btn-outline-info">Cancel</a>
                    <button type="submit" class="btn btn-outline-success">Login</button>
            </form>
        </div>
    </div>
    {%endblock body%}
  </body>
</html>
